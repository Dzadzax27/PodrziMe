version: "3.9"

services:
  podrzime-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: podrzime-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
    ports:
      - "1401:1433"
    networks:
      - podrzimenet2025

  podrzime-api:
    container_name: podrzime-api
    build:
      context: .
    environment:
      - ConnectionStrings:ePodrziMeConnection=${CONNECTION_STRING}
      - RabbitMQ:Host=${RABBITMQ_HOST}
      - RabbitMQ:Username=${RABBITMQ_USERNAME}
      - RabbitMQ:Password=${RABBITMQ_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - PaypalSettings__ClientId=${PAYPAL_CLIENT_ID}
      - PaypalSettings__Secret=${PAYPAL_SECRET}
      - PAYPAL_URL=https://api.sandbox.paypal.com
    ports:
      - "7220:7220"
    depends_on:
      - podrzime-sql
      - podrzime-rabbitmq
    networks:
      - podrzimenet2025

  podrzime-rabbitmq:
    image: rabbitmq:3-management
    container_name: podrzime-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - podrzimenet2025

  podrzime-subscriber:
    container_name: podrzime-subscriber
    build:
      context: .
      dockerfile: PodrziMe.Subscriber/Dockerfile
    environment:
      - RabbitMQ:Host=${RABBITMQ_HOST}
      - RabbitMQ:Username=${RABBITMQ_USERNAME}
      - RabbitMQ:Password=${RABBITMQ_PASSWORD}
    depends_on:
      - podrzime-rabbitmq
    networks:
      - podrzimenet2025

networks:
  podrzimenet2025:
    driver: bridge
