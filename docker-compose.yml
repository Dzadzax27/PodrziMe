version: "3.9"

services:
  podrzime-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: podrzime-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=QWElkj132!
      - MSSQL_PID=Developer
    ports:
      - "1401:1433"
    networks:
      - podrzimenet2025

  podrzime-api:
    container_name: podrzime-api
    build:
      context: .
    environment:
      - ConnectionStrings:ePodrziMeConnection=Server=podrzime-sql;Database=PodrziMe;User=sa;Password=QWElkj132!;TrustServerCertificate=True
      - RabbitMQ:Host=podrzime-rabbitmq
      - RabbitMQ:Username=guest
      - RabbitMQ:Password=guest
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "7220:7220"
    depends_on:
      - podrzime-sql
      - podrzime-rabbitmq
    networks:
      - podrzimenet2025

  podrzime-rabbitmq:
    image: rabbitmq:3-management
    container_name: podrzime-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - podrzimenet2025

  podrzime-subscriber:
    container_name: podrzime-subscriber
    build:
      context: .
      dockerfile: PodrziMe.Subscriber/Dockerfile
    environment:
      - RabbitMQ:Host=podrzime-rabbitmq
      - RabbitMQ:Username=guest
      - RabbitMQ:Password=guest
    depends_on:
      - podrzime-rabbitmq
    networks:
      - podrzimenet2025

networks:
  podrzimenet2025:
    driver: bridge
